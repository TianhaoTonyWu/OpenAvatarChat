default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"

  # History module configuration (required for duplex interrupt detection)
  history:
    retention_mode: "by_both"
    max_events: 1000
    max_age_seconds: 3600
    cleanup_interval_seconds: 30

  chat_engine:
    model_root: "models"
    concurrent_limit: 3
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        connection_ttl: 900
        output_video_fps: 20  # Must equal AvatarMusetalk.fps for correct A/V sync

      # === 打断处理器 - 接收 INTERRUPT 信号并执行流取消 ===
      InterruptHandler:
        module: logic/interrupt/interrupt_handler

      # === 唤醒词：本地 FunASR 听关键词，听到后先说「我在」，播完再打开对话。===
      WakeWord:
        enabled: True
        module: vad/wakeword/wakeword_handler
        keywords:
          - "你好小语"
        model_name: "iic/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-pytorch"
        hotwords:
          - "你好小语"
          - "小语"
        asr_timeout_seconds: 8.0
        speaking_threshold: 0.4
        start_delay: 512  # 32ms：更快进入听写
        end_delay: 4000  # 250ms：尾静音兜底（流式命中可提前到 early_wake_silence）
        early_wake_silence: 1600  # 100ms：纯唤醒词 ASR 已出字即可提前唤醒
        min_speech_samples: 3200
        min_query_chars: 2
        listen_timeout_seconds: 15.0
        cooldown_seconds: 0.3
        ack_text: "我在。"
        ack_display_prefix: "【已唤醒】"
        ack_timeout_seconds: 5.0

      # === 双工 VAD：只给 Duplug 提供 speech 门控，真正判停/转写由 Duplug 完成 ===
      SileroVad:
        module: vad/silerovad/duplex_vad_handler
        speaking_threshold: 0.45  # 近场优先，抑制远处人声
        start_delay: 1024
        end_delay: 9600  # 600ms：只影响 speech 门控，不再用长尾静音拖慢对话
        early_end_delay: 9600
        early_end_repeat_delay: 9600
        buffer_look_back: 6400  # 400ms 真实起音
        speech_padding: 512  # 只补在句尾；起音不再垫 0，避免句首「，」
        volume_threshold: -30  # 近场门限；远处人声通常低于此
        post_end_monitor_samples: 8000  # 500ms：短停后续说仍并回同一句
        reconnect_threshold_samples: 8000
        post_end_speech_trigger_samples: 512  # 1 帧能量即可重连，避免丢掉句尾
        post_end_energy_threshold: -28

      # === ASR：对话文本由 Duplug cascade（Paraformer）在 speak 时提交 ===
      XiaoyuASR:
        enabled: False
        module: asr/xiaoyu/asr_handler_xiaoyu

      # === SoulX-Duplug：官方语义 VAD + 级联 ASR（打断 + 判停 + 转写）===
      # 需先启动 Duplug 推理服务：cd /root/SoulX-Duplug && bash run.sh
      SoulXDuplug:
        enabled: True
        module: vad/duplug/duplug_handler
        server_url: "ws://127.0.0.1:8000/turn"
        chunk_samples: 2560
        sample_rate: 16000
        request_timeout: 5.0
        interrupt_on_nonidle: true
        min_interrupt_chars: 2  # 必须听出至少 2 个有效字才打断，噪音通常没有字
        interrupt_cooldown_seconds: 0.2
        interrupt_grace_seconds: 0.2  # nonidle 需持续 0.2s，过滤短噪声
        min_interrupt_rms: 0.045  # 近场才能打断，远处人声通常到不了
        min_eou_rms: 0.04  # 整句峰值必须达到近场能量才提交
        min_feed_rms: 0.03  # 更安静的块当远场，送给 Duplug 静音
        nearfield_lock_rms: 0.08  # 贴近麦的用户锁定
        nearfield_lock_seconds: 2.5

      # === TTS ===
      CustomTTS:
        enabled: True
        module: tts/custom_tts/tts_handler_custom
        tts_url: "http://14.204.16.34:6021/vox_tts"
        api_key: "maiyuekeji"
        voice_type: "zh_male"
        lang: "zh"
        sample_rate: 24000
        stream: true
        emotion: true
        speedup: true
        min_flush_chars: 3
        
      # === LLM ===
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "hermes"
        enable_video_input: False
        max_tokens: 64
        system_prompt: "你是语音助手。用一两句口语直接回答，不要列举、不要开场白、不要重复问题。"
        api_url: "http://127.0.0.1:8080/v1"
        session_id: "open_avatar_chat_session"
        warmup: true

      # === MuseTalk 数字人 Avatar ===
      AvatarMusetalk:
        module: avatar/musetalk/avatar_handler_musetalk
        fps: 20
        batch_size: 2
        avatar_video_path: "resource/custom5.mp4"
        avatar_model_dir: "models/musetalk/avatar_model"
        force_create_avatar: false
        debug: false
        multi_thread_inference: true
