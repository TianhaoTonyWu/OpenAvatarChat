default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"

  # History module configuration (required for duplex interrupt detection)
  history:
    retention_mode: "by_both"
    max_events: 1000
    max_age_seconds: 3600
    cleanup_interval_seconds: 30

  chat_engine:
    model_root: "models"
    concurrent_limit: 3
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        connection_ttl: 900
        output_video_fps: 24  # Must equal AvatarMusetalk.fps for correct A/V sync

      # === 打断处理器 - 接收 INTERRUPT 信号并执行流取消 ===
      InterruptHandler:
        module: logic/interrupt/interrupt_handler

      # === 唤醒词：只负责开场。听到关键词后打开对话；长时间无人说话再关掉。打断由 Duplug 负责。===
      WakeWord:
        enabled: True
        module: vad/wakeword/wakeword_handler
        keywords:
          - "你好小语"
          - "小语"
        asr_url: "ws://speech.xiaoyuzhineng.com:12392/"
        api_key: "223707f61bf7752c880e"
        asr_timeout_seconds: 8.0
        speaking_threshold: 0.25
        start_delay: 512  # 32ms：更快进入听写
        end_delay: 4000  # 250ms：尾静音兜底（流式命中可提前到 early_wake_silence）
        early_wake_silence: 1600  # 100ms：纯唤醒词 ASR 已出字即可提前唤醒
        min_speech_samples: 3200
        min_query_chars: 2
        listen_timeout_seconds: 15.0
        cooldown_seconds: 0.3
        ack_text: "我在。"
        ack_display_prefix: "【已唤醒】"
        ack_timeout_seconds: 5.0

      # === 双工 VAD：350ms 触发 Duplug 判停，900ms 兜底强制结束 ===
      SileroVad:
        module: vad/silerovad/duplex_vad_handler
        speaking_threshold: 0.25
        start_delay: 1024
        end_delay: 14400  # 900ms 兜底：静音到此仍未判停则强制回答
        early_end_delay: 5600  # 350ms：静音达到后，若 Duplug 判定说完则开始回答
        early_end_repeat_delay: 5600
        buffer_look_back: 2048
        speech_padding: 512
        volume_threshold: -45
        post_end_monitor_samples: 28800  # 1.8s @16kHz，与 SoulXDuplug.post_end_wait_seconds 对齐
        reconnect_threshold_samples: 28800  # 1.8s：判停后此时间内续说视为同一句
        post_end_energy_threshold: -5

      # === ASR：对话文本由 Duplug 在判停时提交，避免第二路识别污染 LLM ===
      XiaoyuASR:
        enabled: False
        module: asr/xiaoyu/asr_handler_xiaoyu
        asr_url: "ws://speech.xiaoyuzhineng.com:12392/"
        api_key: "223707f61bf7752c880e"
        timeout_seconds: 15.0
        sample_rate: 16000
        input_type_override:
          HUMAN_AUDIO: HUMAN_DUPLEX_AUDIO

      # === SoulX-Duplug：全双工语义 VAD（打断 + 判停）===
      # 需先启动 Duplug 推理服务：cd /root/SoulX-Duplug && bash run.sh
      SoulXDuplug:
        enabled: True
        module: vad/duplug/duplug_handler
        server_url: "ws://127.0.0.1:8000/turn"
        chunk_samples: 2560
        sample_rate: 16000
        request_timeout: 5.0
        interrupt_on_nonidle: true
        min_interrupt_chars: 2
        interrupt_cooldown_seconds: 0.4
        interrupt_grace_seconds: 0.3
        asr_url: "ws://speech.xiaoyuzhineng.com:12392/"
        api_key: "223707f61bf7752c880e"
        asr_timeout_seconds: 8.0
        post_end_wait_seconds: 1.8  # 与 SileroVad.post_end_monitor_samples=28800 对齐

      # === TTS ===
      CustomTTS:
        enabled: True
        module: tts/custom_tts/tts_handler_custom
        tts_url: "http://14.204.16.34:6021/vox_tts"
        api_key: "maiyuekeji"
        voice_type: "zh_male"
        lang: "zh"
        sample_rate: 16000
        stream: true
        min_flush_chars: 4

      # === LLM ===
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "hermes"
        enable_video_input: False
        history_length: 20
        system_prompt: "你是一个语音助手，用一两句简洁的话回答用户的问题。"
        api_url: "http://127.0.0.1:8080/v1"
        session_id: "open_avatar_chat_session"
        warmup: true

      # === MuseTalk 数字人 Avatar ===
      AvatarMusetalk:
        module: avatar/musetalk/avatar_handler_musetalk
        fps: 24
        batch_size: 2
        avatar_video_path: "resource/custom5.mp4"
        avatar_model_dir: "models/musetalk/avatar_model"
        force_create_avatar: false
        debug: false
        multi_thread_inference: true
